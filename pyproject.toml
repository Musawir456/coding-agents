[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agents"
version = "0.1.0"
description = "Multi-agent coding assistant: a Planner, a Coder and a Reviewer collaborate on a task inside a sandboxed workspace, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
coding-agents = "coding_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
